[project]
name = "claude-office-worker"
version = "0.1.0"
description = "Give Claude a roster of AI coworkers."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["office*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
